<!DOCTYPE html>
<html lang="it">
<head>

<style>
:root{--bg:#07080a;--card:#1f242c;--card2:#2a3039;--bd:#3d4552;--w:#f2f3f5;--d:#b6bcc6;--m:#7f8794;--y:#f5c542;--g:#6ee7b7;--r:#f87171}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--w);font-family:'Space Grotesk',system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{touch-action:manipulation;padding:calc(14px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer}
.pagina{max-width:1040px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--bd);margin-bottom:14px}
.top b{font-size:15px;letter-spacing:.02em}
.top .ad{margin-left:auto;font-size:10px;color:var(--y);border:1px solid rgba(245,197,66,.5);border-radius:99px;padding:3px 9px;letter-spacing:.08em}
.indietro{background:none;border:none;color:var(--d);font-size:22px;padding:0 6px 0 0;line-height:1}
.cerca{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:11px 12px;font-family:'DM Mono',monospace;font-size:16px;color:var(--w);margin-bottom:12px}
.cerca::placeholder{color:var(--m)}
.sez{font-size:10.5px;letter-spacing:.12em;color:var(--m);margin:18px 2px 8px;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.riga{display:flex;align-items:center;gap:10px;padding:12px 14px;width:100%;background:none;border:none;color:inherit;text-align:left}
.riga + .riga{border-top:1px solid var(--bd)}
.riga.sel{background:var(--card2)}
.riga .c{flex:1;min-width:0}.riga .t{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.riga .s{font-size:11.5px;color:var(--m);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pall{width:8px;height:8px;border-radius:50%;flex:none}
.fr{color:var(--m)}
.tag{font-size:10px;border-radius:99px;padding:3px 8px;border:1px solid var(--bd);color:var(--d);white-space:nowrap}
.tag.g{border-color:rgba(110,231,183,.5);color:var(--g)}.tag.r{border-color:rgba(248,113,113,.5);color:var(--r)}.tag.y{border-color:rgba(245,197,66,.5);color:var(--y)}
.nome{font-size:20px;font-weight:700}
.sotto{font-size:12px;color:var(--m);margin-top:3px;line-height:1.5;word-break:break-word}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;font-size:13px}
.kv + .kv{border-top:1px solid var(--bd)}
.kv span:last-child{font-family:'DM Mono',monospace;color:var(--d);font-size:12.5px;text-align:right}
.btn{display:block;width:100%;text-align:center;padding:12px;border-radius:11px;border:1px solid var(--bd);background:none;color:var(--w);font-size:13.5px;margin-top:8px}
.btn.y{background:var(--y);border-color:var(--y);color:#111;font-weight:700}
.btn.r{border-color:rgba(248,113,113,.5);color:var(--r)}
.btn:disabled{opacity:.5}
.due{display:flex;gap:8px}.due .btn{flex:1}
.mini{background:none;border:1px solid var(--bd);border-radius:99px;color:var(--d);font-size:11px;padding:5px 10px;margin-left:6px;white-space:nowrap}
.mini.r{border-color:rgba(248,113,113,.4);color:var(--r)}
.nota{font-size:12.5px;color:var(--d);line-height:1.5;margin:10px 2px 0}
.vuoto{padding:22px 16px;color:var(--m);font-size:13px;text-align:center}
.ok{color:var(--g) !important}.no{color:var(--r) !important}.boh{color:var(--y) !important}
#velo{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:16px}
#velo.on{display:flex}
#foglio{background:var(--card);border:1px solid var(--bd);border-radius:16px;width:100%;max-width:420px;padding:18px;max-height:80vh;overflow:auto}
#foglio h3{margin:0 0 4px;font-size:16px}
#avviso{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--card2);border:1px solid var(--bd);
  border-radius:99px;padding:10px 16px;font-size:13px;display:none;z-index:60;max-width:90vw}
#avviso.on{display:block}#avviso.r{border-color:rgba(248,113,113,.6);color:var(--r)}
/* Sul telefono si vede una cosa alla volta; su uno schermo largo l'elenco
   resta a sinistra e la scheda si apre a destra. */
#scheda{display:none}
.ling{display:flex;gap:6px;margin-bottom:14px}
.ling button{flex:1;padding:9px 0;border-radius:10px;border:1px solid var(--bd);background:none;color:var(--d);font-size:13px}
.ling button.on{background:var(--y);border-color:var(--y);color:#111;font-weight:700}
body.aperta .ling{display:none}
.tre{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tre .card{padding:12px 12px 11px}
.tre b{display:block;font-family:'DM Mono',monospace;font-size:19px;font-weight:400;letter-spacing:-.02em}
.tre span{display:block;font-size:11px;color:var(--m);margin-top:3px}
.passo{display:flex;gap:12px;padding:11px 14px;font-size:13px;line-height:1.45}
.passo + .passo{border-top:1px solid var(--bd)}
.passo time{font-family:'DM Mono',monospace;font-size:11.5px;color:var(--m);flex:none;width:58px;padding-top:1px}
.passo .d{color:var(--d);font-size:12.5px;word-break:break-word}
.riga .t.due-righe{white-space:normal}
#foglio pre{font-family:'DM Mono',monospace;font-size:11px;line-height:1.5;color:var(--d);white-space:pre-wrap;word-break:break-word;margin:10px 0 0;user-select:text;-webkit-user-select:text}
#foglio.largo{max-width:760px}
#foglio textarea{width:100%;min-height:96px;resize:vertical;background:var(--bg);border:1px solid var(--bd);border-radius:10px;color:var(--w);font:inherit;font-size:16px;padding:10px 12px;margin-top:12px}
#foglio label{display:block;font-size:11.5px;color:var(--m);margin:12px 0 0;letter-spacing:.04em}
#foglio label + .cerca{margin:5px 0 0}
.graf{padding:12px 12px 10px}
.graf h4{margin:0 0 2px;font-size:13px;font-weight:500;color:var(--d)}
.graf svg{display:block;width:100%;height:auto;overflow:visible}
.graf .asse{stroke:var(--bd);stroke-width:1}
.graf text{font-family:'DM Mono',monospace;font-size:9.5px;fill:var(--m)}
.graf text.v{fill:var(--d)}
.graf .b{fill:#4b8ef0}.graf .l{fill:none;stroke:#4b8ef0;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.graf .p{fill:#4b8ef0;stroke:var(--card);stroke-width:2}
.graf .tocca{fill:transparent;cursor:pointer}.graf .tocca:hover,.graf .tocca.on{fill:rgba(255,255,255,.06)}
.graf .dice{font-size:12px;color:var(--d);min-height:17px;margin-top:6px;font-family:'DM Mono',monospace}
body.sola #scheda{display:none !important}
body.aperta #elenco{display:none}
body.aperta #scheda{display:block}
@media (min-width:900px){
  #corpo{display:grid;grid-template-columns:380px 1fr;gap:22px;align-items:start}
  body.sola #corpo{display:block;max-width:560px}
  body.aperta .ling{display:flex}
  .ling{max-width:380px}
  body.aperta #elenco{display:block}
  #scheda{display:block}
  .indietro{display:none}
  #velo{align-items:center}
}
</style>
</head>
<body>
<div class="pagina">
  <div class="top"><button class="indietro" id="indietro" onclick="chiudiScheda()" style="display:none" aria-label="Indietro">‹</button><b>CAMPOBASE</b><span class="ad">ADMIN</span></div>
  <div id="porta"></div>
  <div class="ling" id="ling" style="display:none">
    <button data-l="persone" class="on" onclick="vaiA('persone')">Persone</button><button data-l="film" onclick="vaiA('film')">Film</button><button data-l="posta" onclick="vaiA('posta')">Posta</button><button data-l="server" onclick="vaiA('server')">Server</button>
  </div>
  <div id="corpo" style="display:none">
    <div id="elenco">
      <input class="cerca" id="cerca" placeholder="Cerca nome, mail, film…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="card" id="lista"></div>
      <div class="sez" id="conta"></div>
    </div>
    <div id="scheda"></div>
  </div>
</div>
<div id="piede" style="max-width:1040px;margin:34px auto 0;padding-top:14px;border-top:1px solid var(--bd);text-align:center;font-size:11px;color:var(--m);line-height:1.7">
  <span id="versione" style="font-family:'DM Mono',monospace">A —</span>
  <div id="esciRiga" style="display:none;margin-top:10px"><button class="mini" style="margin:0" onclick="esci()">Esci</button></div></div>
<div id="velo" onclick="if(event.target===this)chiudiFoglio()"><div id="foglio"></div></div>
<div id="avviso"></div>

<script>
const SUPA_URL  = 'https://cmeccqzlkinpwalmehdf.supabase.co';
const SUPA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNtZWNjcXpsa2lucHdhbG1laGRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMDEwMTIsImV4cCI6MjA5NDY3NzAxMn0.FdamHVdDLkgKSnGgt39eAFE3dXQLgWoQQ1dXrBUxF90';
const sb = supabase.createClient(SUPA_URL, SUPA_ANON);

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const ADMIN_VERSIONE = '1.9';
let PERSONE = [], FILM = [], aperta = null, corsa = 0, LING = 'persone', FILM_TUTTI = [], POSTA = null, corsaL = 0;

/* Ogni richiesta passa dal server con il proprio accesso: e' lui a dire
   se chi chiede puo'. La pagina da sola non vede niente. */
async function chiedi(azione, dati) {
  const { data } = await sb.auth.getSession();
  const token = data && data.session && data.session.access_token;
  if (!token) { const e = new Error('non sei entrato'); e.stato = 401; throw e; }
  const r = await fetch('/api/admin', { method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: JSON.stringify({ azione, ...(dati || {}) }) });
  let d = {}; try { d = await r.json(); } catch (_) {}
  if (!r.ok) { const e = new Error(d.error || ('errore ' + r.status)); e.stato = r.status; e.dati = d; throw e; }
  return d;
}

function avvisa(testo, rosso) {
  const a = document.getElementById('avviso');
  a.textContent = testo; a.className = 'on' + (rosso ? ' r' : '');
  clearTimeout(avvisa.t); avvisa.t = setTimeout(() => { a.className = ''; }, rosso ? 6000 : 3000);
}

/* Le date, come si dicono: "oggi 14:20", "ieri 23:51", "9 nov". */
function quando(iso, conOra) {
  if (!iso) return '';
  const d = new Date(iso); if (isNaN(d)) return '';
  const giorno = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((giorno(new Date()) - giorno(d)) / 86400000);
  const ora = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  const M = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
  if (diff === 0) return 'oggi ' + ora;
  if (diff === 1) return 'ieri ' + ora;
  return d.getDate() + ' ' + M[d.getMonth()] + (conOra ? ' ' + ora : '');
}
const nomeDi = p => [p.nome, p.cognome].filter(Boolean).join(' ') || p.email || 'Senza nome';
const sigle = p => (p.film || []).map(f => f.sigla || f.titolo).join(', ');

/* ── L'ingresso ── */
async function entra() {
  const porta = document.getElementById('porta');
  try {
    await chiedi('io');
  } catch (e) {
    document.getElementById('corpo').style.display = 'none';
    document.getElementById('esciRiga').style.display = 'none';
    /* chi esce non lascia sullo schermo i dati di prima */
    PERSONE = []; FILM = []; FILM_TUTTI = []; POSTA = null; aperta = null; corsa++; giro++; LING = 'persone';
    document.getElementById('ling').style.display = 'none'; document.body.classList.remove('sola');
    document.body.classList.remove('aperta'); document.getElementById('indietro').style.display = 'none';
    document.getElementById('scheda').innerHTML = ''; document.getElementById('lista').innerHTML = '';
    document.getElementById('conta').textContent = '';
    if (e.stato === 401) {
      /* Aggiunta alla Home dell'iPhone, questa pagina ha una memoria sua,
         separata da quella di Campobase: l'accesso fatto nell'app qui non
         c'e'. Quindi si entra da qui, con lo stesso account. */
      porta.innerHTML = '<div style="max-width:340px;margin:18vh auto 0">' +
        '<input class="cerca" id="aMail" type="email" placeholder="Email" autocomplete="username" autocapitalize="off">' +
        '<input class="cerca" id="aPass" type="password" placeholder="Password" autocomplete="current-password">' +
        '<button class="btn y" id="aEntra" style="margin-top:0" onclick="accedi()">Entra</button>' +
        '<button class="btn" onclick="accediGoogle()">Entra con Google</button>' +
        '<div class="nota no" id="aErrore"></div></div>';
    } else if (e.stato === 403) {
      porta.innerHTML = '<div class="card"><div class="vuoto">Questa pagina è riservata.' +
        (e.dati && e.dati.id ? '<br><br><span style="font-family:DM Mono,monospace;font-size:11px;color:var(--d);word-break:break-all">' + esc(e.dati.id) + '</span>' : '') +
        '<br><br><button class="mini" style="margin:0" onclick="esci()">Esci da questo account</button></div></div>';
    } else {
      porta.innerHTML = '<div class="card"><div class="vuoto">Non riesco a parlare con il server: ' + esc(e.message) + '</div></div>';
    }
    return;
  }
  porta.innerHTML = '';
  document.getElementById('corpo').style.display = '';
  document.getElementById('esciRiga').style.display = '';
  document.getElementById('ling').style.display = '';
  await caricaPersone();
}

async function accedi() {
  const t = document.getElementById('aEntra'), err = document.getElementById('aErrore');
  t.disabled = true; err.textContent = '';
  try {
    const { error } = await sb.auth.signInWithPassword({ email: document.getElementById('aMail').value.trim(),
                                                         password: document.getElementById('aPass').value });
    if (error) throw error;
    await entra();
  } catch (e) { err.textContent = /invalid login/i.test(e.message || '') ? 'Email o password sbagliate.' : (e.message || 'Accesso non riuscito'); t.disabled = false; }
}
async function accediGoogle() {
  await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + '/admin.html' } });
}
async function esci() { try { await sb.auth.signOut(); } catch (_) {} entra(); }

/* ── L'elenco ── */
async function caricaPersone() {
  const lista = document.getElementById('lista');
  if (!PERSONE.length) lista.innerHTML = '<div class="vuoto">Carico…</div>';
  try {
    const d = await chiedi('persone');
    PERSONE = d.persone || []; FILM = d.film || [];
    disegnaLista();
  } catch (e) { lista.innerHTML = '<div class="vuoto no">' + esc(e.message) + '</div>'; }
}
function statoDi(p) {
  if (p.bloccato) return ['var(--r)', '<span class="tag r">bloccato</span>'];
  if (!(p.film || []).length) return ['var(--m)', '<span class="fr">›</span>'];
  if (!p.telefoni) return ['var(--y)', '<span class="tag y">senza notifiche</span>'];
  return ['var(--g)', '<span class="fr">›</span>'];
}
function disegnaLista() {
  if (LING !== 'persone') return disegnaElenco();
  const q = document.getElementById('cerca').value.trim().toLowerCase();
  const mostrate = PERSONE.filter(p => !q || [nomeDi(p), p.email, p.reparto, (p.film || []).map(f => f.titolo + ' ' + (f.sigla || '')).join(' ')]
    .join(' ').toLowerCase().includes(q));
  document.getElementById('lista').innerHTML = mostrate.length ? mostrate.map(p => {
    const [colore, coda] = statoDi(p);
    const sotto = [p.reparto, sigle(p) || 'nessun film', p.bloccato ? '' : (p.ultima ? quando(p.ultima) : 'mai aperta')].filter(Boolean).join(' · ');
    return '<button class="riga' + (aperta === p.id ? ' sel' : '') + '" onclick="apriScheda(\'' + p.id + '\')">' +
      '<span class="pall" style="background:' + colore + '"></span>' +
      '<span class="c"><span class="t">' + esc(nomeDi(p)) + '</span><div class="s">' + esc(sotto) + '</div></span>' + coda + '</button>';
  }).join('') : '<div class="vuoto">Nessuno trovato.</div>';
  const conFilm = new Set(); PERSONE.forEach(p => (p.film || []).forEach(f => conFilm.add(f.id)));
  // Un film e' di una troupe quando dentro c'e' piu' di una persona: gli
  // altri sono analisi di una persona sola, o prove rimaste li'.
  const troupe = FILM.filter(f => (f.membri || 0) > 1).length, soli = FILM.length - troupe;
  document.getElementById('conta').textContent = PERSONE.length + ' persone · ' + troupe + ' film con una troupe' +
    (soli ? ' · ' + soli + ' di una persona sola' : '');
}
document.getElementById('cerca').addEventListener('input', disegnaLista);

/* ── La scheda di una persona ── */
async function apriScheda(id) {
  if (LING !== 'persone') mostraLing('persone');
  aperta = id; const mia = ++corsa;
  document.body.classList.add('aperta'); document.getElementById('indietro').style.display = '';
  const s = document.getElementById('scheda');
  s.innerHTML = '<div class="vuoto">Carico…</div>'; disegnaLista(); window.scrollTo(0, 0);
  try {
    const p = await chiedi('persona', { id });
    if (mia !== corsa) return;
    disegnaScheda(p);
  } catch (e) { if (mia === corsa) s.innerHTML = '<div class="vuoto no">' + esc(e.message) + '</div>'; }
}
function chiudiScheda() {
  aperta = null; corsa++;
  document.body.classList.remove('aperta'); document.getElementById('indietro').style.display = 'none';
  document.getElementById('scheda').innerHTML = ''; disegnaLista();
}
function disegnaScheda(p) {
  const ultime = p.notifiche || [];
  const mostrate = ultime.filter(n => n.mostrato).length, senza = ultime.filter(n => !n.mostrato && (n.dispositivi || 0) > 0).length;
  const prima = ultime[0];
  const tel = (p.telefoni || []).length;
  const consumi = Object.entries(p.consumi || {});
  document.getElementById('scheda').innerHTML =
    '<div class="nome">' + esc(nomeDi(p)) + (p.bloccato ? ' <span class="tag r" style="vertical-align:middle">bloccato</span>' : '') + '</div>' +
    '<div class="sotto">' + esc([p.reparto, p.email].filter(Boolean).join(' · ')) + '<br>' +
      esc(['iscritto ' + (quando(p.iscritto) || '—'), 'ultima apertura ' + (quando(p.ultima, true) || 'mai')].join(' · ')) + '</div>' +

    '<div class="sez">Film</div>' +
    '<div class="card">' + ((p.film || []).length ? p.film.map(f =>
      '<div class="riga"><span class="c"><span class="t">' + esc(f.titolo) + '</span><div class="s">' +
        esc([f.ruolo === 'capo' ? 'ha aperto il film' : 'membro', f.segna ? 'segna le scene' : ''].filter(Boolean).join(' · ')) + '</div></span>' +
        (f.ruolo === 'capo' ? '' : '<button class="mini" onclick="scegliFilm(\'sposta\',\'' + f.id + '\')">Sposta</button>' +
          '<button class="mini r" onclick="togli(\'' + f.id + '\')">Togli</button>') + '</div>').join('')
      : '<div class="vuoto">In nessun film.</div>') + '</div>' +
    (p.bloccato ? '' : '<button class="btn" onclick="scegliFilm(\'aggiungi\')">Aggiungi a un film</button>') +

    '<div class="sez">Notifiche</div>' +
    '<div class="card">' +
      '<div class="kv"><span>Telefoni iscritti</span><span class="' + (tel ? '' : 'boh') + '">' + (tel ? tel + ' · ' + esc([...new Set(p.telefoni.map(t => t.tipo))].join(', ')) : 'nessuno') + '</span></div>' +
      (prima ? '<div class="kv"><span>Ultima partita</span><span>' + esc(quando(prima.mandato, true)) + '</span></div>' +
        '<div class="kv"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(prima.titolo) + '</span><span class="' + (prima.mostrato ? 'ok' : 'boh') + '">' +
          (prima.mostrato ? 'mostrata' : (prima.dispositivi ? 'senza conferma' : 'nessun telefono')) + '</span></div>' +
        '<div class="kv"><span>Ultime ' + ultime.length + '</span><span>' + mostrate + ' mostrate · ' + senza + ' senza conferma</span></div>'

/* ── Il foglio per scegliere e per confermare ── */
function apriFoglio(html) { document.getElementById('foglio').innerHTML = html; document.getElementById('velo').classList.add('on'); }
function chiudiFoglio() { document.getElementById('velo').classList.remove('on'); document.getElementById('foglio').classList.remove('largo'); }

async function fai(azione, dati, fatto) {

/* ── La prova di notifica: partita, accettata, mostrata ── */
let giro = 0;
function disegnaEsito(titolo, e, secondi, fine) {

  else if (partita && !tel) nota = 'Non ha nessun telefono iscritto: deve aprire Campobase dalla schermata Home e accendere "Avvisi sul telefono" nelle impostazioni.';
  else if (fine) nota = 'Accettata ma non confermata dal telefono. Può averla mostrata senza dirlo (app non aperta da prima del 16 novembre), oppure non l\'ha mostrata: notifiche spente nelle impostazioni dell\'iPhone, o una Full immersion attiva.';
  document.getElementById('esito').innerHTML = '<div class="sez">' + esc(titolo) + '</div><div class="card">' +
    '<div class="kv"><span>Partita</span><span class="' + (partita ? 'ok' : '') + '">' + (partita ? quando(e.mandato, true) : 'in partenza…') + '</span></div>' +
    '<div class="kv"><span>Accettata</span><span class="' + (tel ? 'ok' : partita ? 'no' : '') + '">' + (partita ? (tel ? 'sì · ' + tel + (tel === 1 ? ' telefono' : ' telefoni') : 'nessun telefono') : '—') + '</span></div>' +

async function segui(titolo, appuntamento) {

/* ── I grafici ──
   Una serie sola per grafico, quindi niente legenda: lo dice il titolo.
   Toccando (o passando sopra) una colonna, sotto compare il suo valore;
   sul grafico restano scritti solo il massimo e l'ultimo. */
function tocca(el, testo) {
  const g = el.closest('.graf'); g.querySelectorAll('.tocca.on').forEach(x => x.classList.remove('on'));
  el.classList.add('on'); g.querySelector('.dice').textContent = testo;
}
const giornoCorto = g => { const d = new Date(g + 'T12:00:00'); return d.getDate() + ' ' + ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'][d.getMonth()]; };
function graficoGiorni(gg) {
  if (!gg.length) return '';
  const W = 320, H = 96, base = 80, alto = 62, passo = W / gg.length, larga = Math.min(14, passo - 2);
  const max = Math.max(...gg.map(g => g.dollari), 0.0001), iMax = gg.findIndex(g => g.dollari === max);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Spesa al giorno"><line class="asse" x1="0" x2="' + W + '" y1="' + base + '" y2="' + base + '"/>';
  gg.forEach((g, i) => {
    const h = g.dollari ? Math.max(2, g.dollari / max * alto) : 0, x = i * passo + (passo - larga) / 2, y = base - h, r = Math.min(3, h);

    if (g.dollari && (i === iMax || i === gg.length - 1)) s += '<text class="v" text-anchor="' + (i === gg.length - 1 ? 'end' : i === 0 ? 'start' : 'middle') + '" x="' + (i === gg.length - 1 ? W : i === 0 ? 0 : x + larga / 2) + '" y="' + (y - 4) + '">' + soldi(g.dollari) + '</text>';
    s += '<rect class="tocca" x="' + (i * passo) + '" y="0" width="' + passo + '" height="' + base + '" data-t="' + esc(giornoCorto(g.giorno) + ' · ' + soldi(g.dollari) + ' · ' + g.chiamate + (g.chiamate === 1 ? ' chiamata' : ' chiamate')) + '" onclick="tocca(this,this.dataset.t)" onmouseenter="tocca(this,this.dataset.t)"/>';
  });
  s += '<text x="0" y="' + (base + 13) + '">' + giornoCorto(gg[0].giorno) + '</text><text text-anchor="end" x="' + W + '" y="' + (base + 13) + '">oggi</text></svg>';
  return s + '<div class="dice">' + (gg.some(g => g.dollari) ? 'Tocca una colonna per il giorno.' : 'Nessuna spesa in questi giorni.') + '</div>';
}
function graficoTempi(tt) {
  const W = 320, H = 96, base = 80, alto = 58, max = Math.max(...tt.map(t => t.secondi)), iMax = tt.findIndex(t => t.secondi === max);
  const passo = W / tt.length, X = i => i * passo + passo / 2, Y = v => base - v / max * alto;

    '<polyline class="l" points="' + tt.map((t, i) => X(i) + ',' + Y(t.secondi)).join(' ') + '"/>';
  tt.forEach((t, i) => {
    const ultimo = i === tt.length - 1;
    if (ultimo || i === iMax) s += '<circle class="p" cx="' + X(i) + '" cy="' + Y(t.secondi) + '" r="4"/><text class="v" text-anchor="' + (X(i) > W - 30 ? 'end' : X(i) < 30 ? 'start' : 'middle') + '" x="' + (X(i) > W - 30 ? W : X(i) < 30 ? 0 : X(i)) + '" y="' + (Y(t.secondi) - 8) + '">' + t.secondi + ' s</text>';
    s += '<rect class="tocca" x="' + (i * passo) + '" y="0" width="' + passo + '" height="' + base + '" data-t="' + esc(quando(t.quando, true) + ' · ' + t.secondi + ' s · ' + t.oggetto) + '" onclick="tocca(this,this.dataset.t)" onmouseenter="tocca(this,this.dataset.t)"/>';
  });
  s += '<text x="0" y="' + (base + 13) + '">' + quando(tt[0].quando) + '</text><text text-anchor="end" x="' + W + '" y="' + (base + 13) + '">ultima</text></svg>';

    v.indietro.map(x => '<button class="riga" onclick="apriScheda(\'' + x.id + '\')"><span class="c"><span class="t">' + esc(x.nome) + '</span><div class="s">' + (x.vista ? 'aperta ' + quando(x.vista, true) : '') + '</div></span><span class="tag y">' + esc(x.versione) + '</span></button>').join('') +
    (v.indietro.length ? '' : '<div class="kv"><span>Rimasti indietro</span><span class="ok">nessuno</span></div>') + '</div>' +
    (v.ignoti ? '<div class="nota">' + v.ignoti + (v.ignoti === 1 ? ' persona non ha' : ' persone non hanno') + ' ancora aperto l\'app da quando si registra la versione.</div>' : '');
}
function apriDettaglio(id) {
  aperta = id; const mia = ++corsa;
  document.body.classList.add('aperta'); document.getElementById('indietro').style.display = '';
  document.getElementById('scheda').innerHTML = '<div class="vuoto">Carico…</div>'; disegnaElenco(); window.scrollTo(0, 0);
  return mia;
}
async function apriFilm(id) {
  if (LING !== 'film') { mostraLing('film'); if (!FILM_TUTTI.length) caricaElenco(); }
  const mia = apriDettaglio(id), s = document.getElementById('scheda');
  try {
    const f = await chiedi('filmUno', { id }); if (mia !== corsa) return;
    s.innerHTML = '<div class="nome">' + esc(f.titolo || 'Senza titolo') + (f.sigla ? ' <span class="tag" style="vertical-align:middle">' + esc(f.sigla) + '</span>' : '') + '</div>' +
      '<div class="sotto">' + esc([f.membri.length === 1 ? '1 persona' : f.membri.length + ' persone', f.esclusi ? f.esclusi + (f.esclusi === 1 ? ' esclusa' : ' escluse') : '',
        f.codice ? 'codice ' + f.codice : ''].filter(Boolean).join(' · ')) +
        (f.casella ? '<br>' + esc(f.casella + '@campobase.dev') : '') + (f.mittente ? '<br>mittente atteso: ' + esc(f.mittente) : '') + '</div>' +
      '<div class="sez">Troupe</div><div class="card">' + f.membri.map(m => '<button class="riga" onclick="apriScheda(\'' + m.id + '\')">' +
        '<span class="pall" style="background:' + (m.telefono ? 'var(--g)' : 'var(--y)') + '"></span><span class="c"><span class="t">' + esc(m.nome) + '</span><div class="s">' +
        esc([m.reparto, m.ruolo === 'capo' ? 'ha aperto il film' : '', m.segna ? 'segna le scene' : '', m.telefono ? '' : 'senza notifiche'].filter(Boolean).join(' · ')) +
        '</div></span><span class="fr">›</span></button>').join('') + '</div>' +
      '<div class="sez">Ultime mail</div><div class="card">' + (f.posta.length ? f.posta.map(m => rigaMailHtml(m, false)).join('') : '<div class="vuoto">Nessuna mail arrivata.</div>') + '</div>' +
      '<div class="sez">Costi dall\'inizio · ' + soldi(f.totale.dollari) + '</div><div class="card">' + (f.consumi.length ? f.consumi.map(x => '<div class="kv"><span>' + esc(SCOPI[x.scopo] || x.scopo) + ' · ' + x.chiamate +
        '</span><span>' + soldi(x.dollari) + ' · ' + mila(x.entrata + x.uscita) + ' token</span></div>').join('') : '<div class="vuoto">Nessuna chiamata al modello.</div>') + '</div>' +
      '<div class="sez">Film</div><button class="btn y" style="margin-top:0" onclick="scriviAllaTroupe()">Scrivi alla troupe</button>' +
      '<button class="btn" onclick="modificaFilm()">Modifica titolo, sigla, mittente</button>' +
      '<button class="btn r" onclick="eliminaFilm()">Elimina il film</button>';
    window.FILM_APERTO = f;
  } catch (e) { if (mia === corsa) s.innerHTML = '<div class="vuoto no">' + esc(e.message) + '</div>'; }
}
/* Un messaggio a tutta la troupe del film: una notifica scritta a mano.
   Il tasto dice a quante persone arriva, ed e' lui la conferma. */
function scriviAllaTroupe() {
  const f = window.FILM_APERTO, n = f.membri.length;
  apriFoglio('<h3>Scrivi alla troupe</h3><div class="sotto">Arriva come notifica a chi è in «' + esc(f.titolo || 'Senza titolo') + '»' + (f.sigla ? ', con «' + esc(f.sigla) + ' - Avviso» come titolo' : '') + '.</div>' +
    '<textarea id="mTesto" maxlength="240" placeholder="Il messaggio"></textarea><div class="sotto" id="mConta" style="text-align:right">0 / 240</div>' +
    '<div class="due"><button class="btn" onclick="chiudiFoglio()">Annulla</button><button class="btn y" id="mSi" disabled>Manda a ' + (n === 1 ? '1 persona' : n + ' persone') + '</button></div>');
  const t = document.getElementById('mTesto'), si = document.getElementById('mSi');
  t.oninput = () => { document.getElementById('mConta').textContent = t.value.length + ' / 240'; si.disabled = t.value.trim().length < 3; };
  si.onclick = async () => {
    const testo = t.value; si.disabled = true;
    try { const r = await chiedi('messaggio', { film: f.id, testo }); chiudiFoglio();
      avvisa('Mandato a ' + r.persone + (r.persone === 1 ? ' persona' : ' persone') + ' · ' + r.raggiunte + ' con le notifiche attive'); }
    catch (e) { si.disabled = false; avvisa(e.message, true); }
  };
}
/* Correggere titolo, sigla e mittente atteso. Si manda solo quello che e' cambiato. */
function modificaFilm() {
  const f = window.FILM_APERTO;
  apriFoglio('<h3>Modifica il film</h3>' +
    '<label>TITOLO</label><input class="cerca" id="fTitolo" autocomplete="off" value="' + esc(f.titolo || '') + '">' +
    '<label>SIGLA · il prefisso delle notifiche</label><input class="cerca" id="fSigla" autocomplete="off" autocapitalize="characters" maxlength="6" placeholder="nessuna" value="' + esc(f.sigla || '') + '">' +
    '<label>MITTENTE ATTESO DELLA POSTA</label><input class="cerca" id="fMittente" type="email" autocomplete="off" autocapitalize="off" placeholder="qualunque" value="' + esc(f.mittente || '') + '">' +
    '<div class="due"><button class="btn" onclick="chiudiFoglio()">Annulla</button><button class="btn y" id="fSi">Salva</button></div>');
  document.getElementById('fSi').onclick = async () => {
    const v = k => document.getElementById(k).value.trim(), c = {};
    if (v('fTitolo') !== (f.titolo || '')) c.titolo = v('fTitolo');
    if (v('fSigla').toUpperCase() !== (f.sigla || '')) c.sigla = v('fSigla');
    if (v('fMittente').toLowerCase() !== (f.mittente || '')) c.mittente = v('fMittente');
    if (!Object.keys(c).length) return chiudiFoglio();
    try { await chiedi('filmCambia', { id: f.id, ...c }); chiudiFoglio(); avvisa('Salvato'); FILM = []; apriFilm(f.id); caricaElenco(); }
    catch (e) { avvisa(e.message, true); }
  };
}
/* Una mail messa da parte perche' non sembrava del film. */
async function accettaMail(id) {
  try { const r = await chiedi('accetta', { id }); avvisa(r.legge === 'server' ? 'Accettata: il server la legge e avvisa la troupe' : 'Accettata: passata ai telefoni'); apriMail(id); caricaElenco(); }
  catch (e) { avvisa(e.message, true); }
}
function scartaMail(id) {
  apriFoglio('<h3>Scartare questa mail?</h3><div class="sotto">Resta in elenco come scartata: nessuno la legge e la troupe non ne sa niente.</div>' +
    '<div class="due"><button class="btn" onclick="chiudiFoglio()">Annulla</button><button class="btn r" id="sSi">Scarta</button></div>');
  document.getElementById('sSi').onclick = async () => { chiudiFoglio();
    try { await chiedi('scarta', { id }); avvisa('Scartata'); apriMail(id); caricaElenco(); } catch (e) { avvisa(e.message, true); } };
}
/* Eliminare un film: si dice cosa va perso e di chi e', e per un film con
   una troupe bisogna riscriverne il titolo. */
function eliminaFilm() {
  const f = window.FILM_APERTO, d = f.dentro || {}, n = f.membri.length, troupe = n > 1;
  const parola = (f.titolo || '').trim() || 'elimina';
  const cose = [d.analisi ? 'lo spoglio e il piano' + (f.capo ? ' di ' + f.capo : '') : '', d.odg ? d.odg + (d.odg === 1 ? ' ordine del giorno' : ' ordini del giorno') : '',
    d.mail ? d.mail + ' mail con gli allegati' : ''].filter(Boolean);
  apriFoglio('<h3>Eliminare «' + esc(f.titolo || 'Senza titolo') + '»?</h3>' +
    '<div class="sotto">' + esc((cose.length ? 'Si cancellano per sempre: ' + cose.join(', ') + '. ' : 'Dentro non c\'è niente. ') +
      (troupe ? 'Le ' + n + ' persone della troupe non lo vedranno più. ' : '') + 'Non si può annullare.') + '</div>' +
    (troupe ? '<input class="cerca" id="eParola" style="margin:12px 0 0" placeholder="Scrivi il titolo per confermare" autocomplete="off" autocapitalize="off" spellcheck="false">' : '') +
    '<div class="due"><button class="btn" onclick="chiudiFoglio()">Annulla</button><button class="btn r" id="eSi"' + (troupe ? ' disabled' : '') + '>Elimina</button></div>');
  const si = document.getElementById('eSi'), campo = document.getElementById('eParola');
  if (campo) campo.oninput = () => { si.disabled = campo.value.trim().toLowerCase() !== parola.toLowerCase(); };
  si.onclick = async () => {
    const conferma = campo ? campo.value : ''; chiudiFoglio();
    try { await chiedi('eliminaFilm', { id: f.id, conferma }); avvisa('Film eliminato'); FILM_TUTTI = FILM_TUTTI.filter(x => x.id !== f.id); POSTA = null; vaiA('film'); }
    catch (e) { avvisa(e.message, true); }
  };
}
async function apriMail(id, zitta) {
  if (LING !== 'posta') { mostraLing('posta'); if (!POSTA) caricaElenco(); }
  // zitta: e' il giro che riguarda da solo durante una rilettura, e non
  // deve far lampeggiare "Carico…" ne' riportare la pagina in cima.
  const s = document.getElementById('scheda'), mia = zitta ? ++corsa : apriDettaglio(id);
  try {
    const m = await chiedi('mail', { id }); if (mia !== corsa) return;
    const ora = iso => { const d = new Date(iso); return isNaN(d) ? '' : [d.getHours(), d.getMinutes(), d.getSeconds()].map(x => String(x).padStart(2, '0')).join(':'); };
    s.innerHTML = '<div class="nome" style="font-size:17px;line-height:1.3">' + esc(m.oggetto) + '</div>' +
      '<div class="sotto">' + esc([m.film.titolo, quando(m.ricevuta, true), m.dollari ? soldi(m.dollari) : ''].filter(Boolean).join(' · ')) +
        ' <span class="tag ' + (m.colore === 'm' ? '' : m.colore) + '" style="margin-left:4px">' + esc(m.esito) + '</span></div>' +
      '<div class="sez">Allegati e come li ha capiti</div><div class="card">' + (m.allegati.length ? m.allegati.map(a => {
        const g = a.tenuto ? (GENERI[a.genere] || ['non riconosciuto', '']) : ['scartato', ''];
        return '<div class="riga"><span class="c"><span class="t due-righe">' + esc(a.nome) + '</span><div class="s">' + peso(a.byte) + '</div></span><span class="tag ' + g[1] + '">' + g[0] + '</span></div>';
      }).join('') : '<div class="vuoto">Senza allegati.</div>') + '</div>' +
      '<div class="sez">Cosa è successo</div><div class="card">' + m.passi.map(p => '<div class="passo"><time>' + ora(p.quando) + '</time><div><span class="' +
        ({ g: 'ok', r: 'no', y: 'boh' }[p.colore] || '') + '">' + esc(p.titolo) + '</span>' + (p.testo ? '<div class="d">' + esc(p.testo) + '</div>' : '') + '</div></div>').join('') + '</div>' +
      (m.nota ? '<div class="nota">' + esc(m.nota) + '</div>' : '') +
      (m.esito === 'da verificare' ? '<button class="btn y" onclick="accettaMail(\'' + m.id + '\')">Accetta e leggi</button>' +
        '<button class="btn r" onclick="scartaMail(\'' + m.id + '\')">Scarta</button>' : '') +
      (m.haOdg ? '<button class="btn" onclick="vediLettura(\'' + m.id + '\',\'odg\')">Vedi la lettura dell\'ordine del giorno</button>' : '') +
      (m.haPiano ? '<button class="btn" onclick="vediLettura(\'' + m.id + '\',\'piano\')">Vedi la lettura del piano</button>' : '') +
      (m.esito === 'in rilettura' ? '<div class="nota boh">Il server la sta rileggendo: di solito ci mette un minuto o due.</div>' :
        m.esito === 'da verificare' ? '' :
        ((m.rileggibile || {}).odg ? '<button class="btn" onclick="rileggi(\'' + m.id + '\',\'odg\')">Fai rileggere l\'ordine del giorno</button>' : '') +
        ((m.rileggibile || {}).piano ? '<button class="btn" onclick="rileggi(\'' + m.id + '\',\'piano\')">Fai rileggere il piano</button>' : ''));
    /* Mentre rilegge si torna a guardare da soli, finche' non ha finito. */
    if (m.esito === 'in rilettura') { const g = ++giro; setTimeout(() => { if (g === giro && aperta === id && LING === 'posta') apriMail(id, true); }, 6000); }
    else if (zitta) caricaElenco();
  } catch (e) { if (mia === corsa) s.innerHTML = '<div class="vuoto no">' + esc(e.message) + '</div>'; }
}
/* Far rileggere una mail: il server riapre gli allegati e riscrive. Se
   avvisare la troupe lo si sceglie ogni volta, e chiudere il foglio senza
   scegliere non fa partire niente. */
function rileggi(id, cosa) {
  const che = cosa === 'piano' ? 'il piano' : 'l\'ordine del giorno';
  apriFoglio('<h3>Far rileggere ' + che + '?</h3>' +
    '<div class="sotto">Il server riapre gli allegati e riscrive ' + che + ' nell\'app di tutti. Costa come una lettura nuova.</div>' +
    '<button class="btn y" id="rMuta">Rileggi senza avvisare</button>' +
    '<button class="btn" id="rAvvisa">Rileggi e manda la notifica a tutta la troupe</button>' +
    '<button class="btn" onclick="chiudiFoglio()">Annulla</button>');
  const vai = async (notifiche) => {
    chiudiFoglio();
    try { await chiedi('rileggi', { id, cosa, notifiche }); avvisa(notifiche ? 'In rilettura, con notifica' : 'In rilettura, senza notifica'); apriMail(id); caricaElenco(); }
    catch (e) { avvisa(e.message, true); }
  };
  document.getElementById('rMuta').onclick = () => vai(false);
  document.getElementById('rAvvisa').onclick = () => vai(true);
}
async function vediLettura(id, cosa) {
  try {
    const d = await chiedi('lettura', { id, cosa });
    document.getElementById('foglio').classList.add('largo');
    apriFoglio('<h3>' + (cosa === 'piano' ? 'Il piano, come l\'ha letto il modello' : 'L\'ordine del giorno, come l\'ha letto il modello') + '</h3>' +
      '<button class="btn" onclick="chiudiFoglio()">Chiudi</button><pre>' + esc(d.letto != null ? JSON.stringify(d.letto, null, 1) : d.testo) + '</pre>');
  } catch (e) { avvisa(e.message, true); }
}

/* Il numero di questa pagina, separato da quello dell'app: "A 1.4" e' la
   prima versione dell'amministrazione, quarto deploy. Il secondo numero si
   alza a ogni modifica di admin.html, cosi' si vede se il deploy e'
   arrivato; il primo scatta (2.0) solo con un rifacimento importante. */
document.getElementById('versione').textContent = 'A ' + ADMIN_VERSIONE;
entra();
